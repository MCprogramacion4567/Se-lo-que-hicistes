</style>

panel.querySelectorAll("button").forEach(b=>b.onclick=()=>setSpeed(+b.dataset.v));
cfg.onclick=e=>{e.stopPropagation();panel.hidden=!panel.hidden;cfg.setAttribute("aria-expanded",!panel.hidden)};
document.addEventListener("click",e=>{if(!panel.hidden&&!panel.contains(e.target)){panel.hidden=true;cfg.setAttribute("aria-expanded","false")}});
setSpeed(mult);

/* Sonido de teclado (Web Audio, sin archivos) */
const VOL="se-lo-que-hiciste-volumen";
let vol=.5, ac=null, nb=null, last=0;
try{const s=localStorage.getItem(VOL);if(s!==null&&!isNaN(+s))vol=Math.min(1,Math.max(0,+s))}catch(e){}
const volEl=$("vol");
volEl.value=Math.round(vol*100);
function unlock(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume()}catch(e){}}
function tick(ch,force){
  if(!vol||!ac||ac.state!=="running"||ch===" ")return;
  const t=ac.currentTime;
  if(!force&&t-last<.03)return;
  last=t;
  if(!nb){
    nb=ac.createBuffer(1,Math.floor(ac.sampleRate*.04),ac.sampleRate);
    const d=nb.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
  }
  const s=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain();
  s.buffer=nb;s.playbackRate.value=.8+Math.random()*.6;
  f.type="bandpass";f.frequency.value=1800+Math.random()*1400;f.Q.value=.9;
  g.gain.value=vol*.8;
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start();
}
volEl.oninput=()=>{vol=volEl.value/100;try{localStorage.setItem(VOL,vol)}catch(e){}unlock();tick("a",true)};
document.addEventListener("pointerdown",unlock);

/* Ambiente y efectos (archivos en la carpeta audio/) */
const AUD={viento:"audio/viento.mp3",pajaros:"audio/pajaros.mp3",clase:"audio/clase.mp3"},
      SFX={grito:"audio/grito.mp3"},
      GAIN={viento:.7,pajaros:.6,clase:.55,grito:1}, AMBK="se-lo-que-hiciste-ambiente";
let amb=.7, ambName=null, ambEl=null;
try{const s=localStorage.getItem(AMBK);if(s!==null&&!isNaN(+s))amb=Math.min(1,Math.max(0,+s))}catch(e){}
const ambInp=$("amb");ambInp.value=Math.round(amb*100);
Object.values(AUD).concat(Object.values(SFX)).forEach(f=>{const a=new Audio();a.preload="auto";a.src=f});
const tryPlay=a=>{const p=a.play();if(p&&p.catch)p.catch(()=>{})};
function fade(a,to,ms,cb){
  clearInterval(a._t);
  const from=a.volume,steps=Math.max(1,Math.round(ms/50));let i=0;
  a._t=setInterval(()=>{
    i++;a.volume=Math.min(1,Math.max(0,from+(to-from)*i/steps));
    if(i>=steps){clearInterval(a._t);if(cb)cb()}
  },50);
}
/* setAmbience("viento"|"pajaros"|"clase"|null): cambia el sonido de fondo con fundido */
function setAmbience(name){
  name=name||null;
  if(name===ambName)return;
  ambName=name;
  const old=ambEl;ambEl=null;
  if(old)fade(old,0,1500,()=>old.pause());
  if(!name)return;
  const a=new Audio(AUD[name]);a.loop=true;a.volume=0;a._g=GAIN[name];ambEl=a;
  tryPlay(a);fade(a,amb*a._g,2000);
}
function sfx(name){
  if(!amb)return;
  const a=new Audio(SFX[name]);a.volume=Math.min(1,amb*GAIN[name]);tryPlay(a);
}
ambInp.oninput=()=>{
  amb=ambInp.value/100;try{localStorage.setItem(AMBK,amb)}catch(e){}
  unlock();if(ambEl){clearInterval(ambEl._t);ambEl.volume=Math.min(1,amb*ambEl._g)}
};
/* el navegador solo deja sonar audio tras un clic: si el ambiente quedó bloqueado, arranca en el primer toque */
document.addEventListener("pointerdown",()=>{if(ambEl&&ambEl.paused)tryPlay(ambEl)});
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const down=()=>{scr.scrollTop=scr.scrollHeight};
const finals=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}};
const save=t=>{const f=finals();if(!f.includes(t)){f.push(t);try{localStorage.setItem(KEY,JSON.stringify(f))}catch(e){}}};
const count=()=>{cnt.textContent="Finales "+finals().length+"/"+TOTAL};
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt)e.textContent=txt;return e};
const setTheme=t=>{theme=t;bg.className=t==="night"?"":t};

/* Imágenes: precarga + fondo desenfocado detrás del teléfono + tarjeta de imagen */
(JSON.stringify(S).match(/img\/[\w.-]+\.(?:jpe?g|png|webp)/g)||[]).forEach(f=>{new Image().src=f});
const IMG=/\.(?:jpe?g|png|webp)$/i;
let curBg="";
function setBackdrop(src){
  if(!src){curBg="";bgi.style.opacity=0;return}
  if(src===curBg)return;
  curBg=src;bgi.style.opacity=0;
  setTimeout(()=>{if(curBg!==src)return;bgi.style.backgroundImage='url("'+src+'")';bgi.style.opacity=.6},450);
}
function pic(src,cap,rev,cls){
  const w=el("div","pic"+(cls?" "+cls:"")), f=el("div","frame"), im=new Image();
  im.src=src;im.alt=cap;im.onload=down;f.appendChild(im);
  if(rev){const r=new Image();r.src=rev;r.alt="";r.className="rev";f.appendChild(r)}
  f.appendChild(el("div","cap",cap));w.appendChild(f);return w;
}

scr.addEventListener("click",()=>{skip=true});

function scare(){
  ph.classList.add("shake");fl.classList.add("on");
  if(navigator.vibrate)navigator.vibrate([80,40,120]);
  setTimeout(()=>{ph.classList.remove("shake");fl.classList.remove("on")},450);
}

async function msg(type,text,tok,fx){
  if(type==="a"){setAmbience(text);return}
  if(type==="w"){await sleep(text);return}
  if(type==="g"){
    const [src,cap,rev,cls]=text, p=pic(src,cap,rev,cls);
    scr.appendChild(p);down();setBackdrop(src);
    if(rev){
      await sleep(1800);if(tok!==run)return;
      p.querySelector(".rev").classList.add("on");setBackdrop(rev);
      ph.classList.add("shake");setTimeout(()=>ph.classList.remove("shake"),450);
      await sleep(1800);
    }else await sleep(500);
    return;
  }
  const w=el("div","msg "+type), b=el("div","bubble");
  w.appendChild(b);scr.appendChild(w);down();
  if(type==="s"){scare();if(fx)sfx(fx)}
  if(type==="p"){b.textContent=text}
  else{
    skip=false;w.classList.add("typing");
    for(let i=1;i<=text.length;i++){
      if(tok!==run)return;
      b.textContent=text.slice(0,i);down();tick(text[i-1]);
      if(!skip)await sleep(BASE/mult);
    }
    w.classList.remove("typing");
  }
  await sleep(skip?150:320/mult);
}

function choices(list){
  const w=el("div","choices");
  list.forEach(([label,next])=>{
    const b=el("button","",label);
    b.onclick=async()=>{
      w.remove();
      const tok=run;
      await msg("p",label,tok);
      play(next,tok);
    };
    w.appendChild(b);
  });
  scr.appendChild(w);down();
}

function ending([icon,title,sub]){
  save(title);count();
  const w=el("div","end");
  w.append(el("div","ic",icon),el("h2","",title),el("p","",sub));
  w.append(el("p","cnt","Finales descubiertos: "+finals().length+" de "+TOTAL));
  const b=el("button","","Volver a empezar");
  b.onclick=start;w.appendChild(b);
  scr.appendChild(w);down();
}

async function play(id,tok=run){
  const n=S[id];
  if(n.t)setTheme(n.t);
  if("a" in n)setAmbience(n.a);
  if(n.s){
    if(IMG.test(n.s[0])){
      scr.appendChild(pic(n.s[0],n.s[1],null,n.s[2]));down();setBackdrop(n.s[0]);
    }else{
      const c=el("div","scene "+theme);
      c.append(el("div","",n.s[0]),el("div","",n.s[1]));
      scr.appendChild(c);down();
    }
  }
  for(const [t,x,fx] of n.m){
    if(tok!==run)return;
    await msg(t,x,tok,fx);
  }
  if(tok!==run)return;
  if(n.n)return play(n.n,tok);
  if(n.c)choices(n.c);else ending(n.e);
}

function start(){
  run++;scr.innerHTML="";setTheme("night");setBackdrop(null);setAmbience(null);count();
  play("start",run);
}
start();
</script>
</body>
</html>
